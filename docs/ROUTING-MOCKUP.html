<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ai-gate · 路由交互原型</title>
<style>
:root{
  --bg:#f8fafc;--card:#fff;--line:#e2e8f0;--line2:#cbd5e1;
  --t1:#0f172a;--t2:#475569;--t3:#94a3b8;
  --pri:#4f46e5;--pri-l:#eef2ff;--pri-d:#4338ca;
  --blue:#0369a1;--blue-l:#e0f2fe;--amber:#b45309;--amber-l:#fef3c7;
  --purple:#7e22ce;--purple-l:#faf5ff;--green:#15803d;--green-l:#f0fdf4;
  --red:#b91c1c;--red-l:#fee2e2;--gray:#475569;--gray-l:#f1f5f9;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',system-ui,-apple-system,'Segoe UI','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--t1);font-size:13px;height:100vh;display:flex;flex-direction:column;overflow:hidden}
button{font-family:inherit;font-size:12px;cursor:pointer;border:1px solid var(--line2);background:#fff;color:var(--t2);border-radius:6px;padding:4px 10px;transition:.15s}
button:hover{border-color:var(--pri);color:var(--pri)}
button.pri{background:var(--pri);border-color:var(--pri);color:#fff}
button.pri:hover{background:var(--pri-d)}
button.ghost{border-color:transparent;background:transparent}
button:disabled{opacity:.45;cursor:not-allowed}
input,select,textarea{font-family:inherit;font-size:12px;border:1px solid var(--line2);border-radius:6px;padding:5px 8px;color:var(--t1);background:#fff;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--pri);box-shadow:0 0 0 2px var(--pri-l)}
#titlebar{height:38px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 14px;gap:10px;flex-shrink:0;-webkit-user-select:none;user-select:none}
#titlebar .dot{width:11px;height:11px;border-radius:50%}
#titlebar .brand{font-weight:600;font-size:13px;margin-left:6px}
#titlebar .sub{color:var(--t3);font-size:11px}
#titlebar .win{margin-left:auto;display:flex;gap:8px}
#titlebar .win span{width:12px;height:12px;border-radius:50%;border:1px solid var(--line2)}
#layout{flex:1;display:flex;min-height:0}
#sidenav{width:190px;background:#fff;border-right:1px solid var(--line);padding:14px 10px;display:flex;flex-direction:column;gap:2px;flex-shrink:0}
.nav-item{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:8px;color:var(--t2);cursor:pointer;font-size:13px}
.nav-item svg{width:15px;height:15px;flex-shrink:0}
.nav-item:hover{background:var(--gray-l)}
.nav-item.on{background:var(--pri-l);color:var(--pri);font-weight:500}
#content{flex:1;overflow:auto;padding:20px 24px;min-width:0}
.page{display:none}.page.on{display:block}
.ph{display:flex;align-items:baseline;gap:12px;margin-bottom:16px}
.ph h1{font-size:17px;font-weight:600}
.ph .desc{color:var(--t3);font-size:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,1fr)}.g2{grid-template-columns:1fr 1fr}
.stat .num{font-size:22px;font-weight:600;margin:2px 0}
.stat .lab{color:var(--t3);font-size:11px}
.stat .hint{color:var(--t2);font-size:11px}
table{width:100%;border-collapse:collapse}
th{font-size:11px;color:var(--t3);text-align:left;font-weight:500;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px;border-bottom:1px solid var(--line);font-size:12px;vertical-align:middle}
tr:last-child td{border-bottom:none}
tbody tr:hover{background:#fafbfe}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;padding:1px 8px;border-radius:999px;white-space:nowrap}
.b-blue{background:var(--blue-l);color:var(--blue)}.b-amber{background:var(--amber-l);color:var(--amber)}
.b-purple{background:var(--purple-l);color:var(--purple)}.b-green{background:var(--green-l);color:var(--green)}
.b-red{background:var(--red-l);color:var(--red)}.b-gray{background:var(--gray-l);color:var(--gray)}
.b-pri{background:var(--pri-l);color:var(--pri)}
.dot-s{width:8px;height:8px;border-radius:50%;display:inline-block;flex-shrink:0}
.split{display:flex;gap:16px;min-height:0}
.list-col{width:230px;flex-shrink:0;display:flex;flex-direction:column;gap:8px}
.l-item{padding:10px 12px;border:1px solid var(--line);border-radius:10px;cursor:pointer;background:#fff}
.l-item:hover{border-color:var(--pri)}
.l-item.on{border-color:var(--pri);background:var(--pri-l)}
.l-item .nm{font-weight:500;font-size:13px;display:flex;align-items:center;gap:6px}
.l-item .mt{color:var(--t3);font-size:11px;margin-top:3px}
.detail{flex:1;min-width:0}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px}
.tab{padding:7px 14px;cursor:pointer;font-size:12px;color:var(--t2);border-bottom:2px solid transparent;margin-bottom:-1px}
.tab:hover{color:var(--pri)}
.tab.on{color:var(--pri);border-color:var(--pri);font-weight:500}
.kv{display:grid;grid-template-columns:110px 1fr;gap:6px 12px;font-size:12px}
.kv .k{color:var(--t3)}
.step{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border:1px solid var(--line2);border-radius:5px;background:#fff;font-size:11px;color:var(--t2)}
.step:hover{border-color:var(--pri);color:var(--pri)}
.mono{font-family:ui-monospace,'Cascadia Code',Consolas,monospace;font-size:11px}
#mask{position:fixed;inset:0;background:rgba(15,23,42,.32);opacity:0;pointer-events:none;transition:.2s;z-index:40}
#mask.on{opacity:1;pointer-events:auto}
#drawer{position:fixed;top:0;right:0;bottom:0;width:470px;background:#fff;border-left:1px solid var(--line);z-index:50;transform:translateX(100%);transition:.22s;display:flex;flex-direction:column;box-shadow:-8px 0 30px rgba(15,23,42,.08)}
#drawer.on{transform:none}
#drawer .dh{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center}
#drawer .dh b{font-size:14px}
#drawer .dh .x{margin-left:auto}
#drawer .db{padding:16px 18px;overflow:auto;flex:1}
.expand{cursor:pointer;color:var(--pri);font-size:11px;white-space:nowrap}
.tree{background:var(--gray-l);border-radius:10px;padding:10px 14px;margin:6px 0 2px}
.trow{display:flex;gap:8px;align-items:center;padding:3px 0;font-size:12px}
.trow .rl{width:52px;flex-shrink:0}
.attempt-bar{height:5px;border-radius:3px;background:var(--line);position:relative;margin:4px 0 10px}
.attempt-bar i{position:absolute;top:-3px;width:2px;height:11px;border-radius:2px}
.bar{height:8px;border-radius:4px;background:var(--pri);min-width:2px}
.hbar{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--t2);margin:5px 0}
.hbar .bl{width:120px;flex-shrink:0;text-align:right;color:var(--t3)}
pre.json{background:#0f172a;color:#e2e8f0;border-radius:10px;padding:12px;font-size:11px;line-height:1.65;font-family:ui-monospace,Consolas,monospace;overflow:auto}
pre.json .hl{color:#fbbf24;font-weight:600}
pre.json .hl2{color:#34d399;font-weight:600}
.note{background:var(--amber-l);border:1px solid #fde68a;color:#92400e;border-radius:8px;padding:8px 12px;font-size:11px;line-height:1.6}
.sim-line{display:flex;gap:8px;align-items:flex-start;font-size:12px;padding:2px 0}
.sim-line .ok{color:var(--green);font-weight:600}
.sim-line .no{color:var(--red)}
.sim-line .wa{color:var(--amber)}
.result-box{border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:#fafbfe}
.cand-row{display:flex;align-items:center;gap:10px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;background:#fff}
.dag-svg text{font-size:10px;font-family:inherit}
.fld{margin-bottom:12px}
.fld label{display:block;font-size:11px;color:var(--t3);margin-bottom:5px}
.fld textarea{width:100%;min-height:88px;resize:vertical;font-family:ui-monospace,Consolas,monospace;font-size:11px}
.empty{color:var(--t3);text-align:center;padding:40px 0;font-size:12px}
.mini{font-size:11px;color:var(--t3)}
.hr{border-top:1px solid var(--line);margin:12px 0}
</style>
</head>

function renderNav(){

function badge(t,cls){return `<span class="badge ${cls}">${t}</span>`}
function typeBadge(t){return badge(t,t==='routing'?'b-blue':t==='wrapper'?'b-amber':'b-purple')}
function connCell(c){
  const [col,txt]=connLight(c);
  return `<span class="badge ${c.cooldown?'b-gray':c.circuit==='closed'?'b-green':c.circuit==='half_open'?'b-amber':'b-red'}"><span class="dot-s" style="background:${col}"></span>${txt}</span>`;
}
function priceStr(p){return p?`$${p.in} / $${p.out}${p.ch!=null?' / $'+p.ch:''}`:'<span style="color:var(--t3)">订阅额度</span>'}

function gCands(gid){return groups.find(g=>g.id===gid).candidates}
function candAdj(gid,i,d){const cd=gCands(gid)[i];cd.weight=Math.max(1,Math.min(100,cd.weight+d));renderGroups()}

function simulate(gid){
  const g=groups.find(x=>x.id===gid);const lines=[];const alive=[];
  for(const cd of g.candidates.filter(c=>c.on)){
    const c=chById(cd.channel);lines.push({ok:null,t:`<b>候选</b> ${c.name} · ${cd.up}（w=${cd.weight}, p=${cd.priority}）`});
    for(const k of c.connections){
      if(k.cooldown){lines.push({ok:false,t:`key <span class="mono">${k.name}</span> — L2 冷却至 ${k.cooldown}（终态，永不自动复活）`});continue}
      if(k.circuit==='open'){lines.push({ok:false,t:`key <span class="mono">${k.name}</span> — L1 熔断（连续失败，等待半开探测）`});continue}
      if(k.circuit==='half_open'){lines.push({ok:false,t:`key <span class="mono">${k.name}</span> — L1 半开探测中（放行试探流量）`});continue}
      if(k.scope && !k.scope.split(',').some(p=>new RegExp('^'+p.trim().replace(/[*]/g,'.*')+'$').test(cd.up))){lines.push({ok:false,t:`key <span class="mono">${k.name}</span> — model_scope 不含 ${cd.up}（Q2）`});continue}
      lines.push({ok:true,t:`key <span class="mono">${k.name}</span> 可用（w=${k.weight}, err ${k.err}%）`});alive.push({c,k,cd});
    }
  }
  if(!alive.length){state.simResult={lines,pick:'无可用候选 → 返回 503 + 各 attempt 失败原因（不做无限重试）',sticky:null};renderGroups();return}
  const total=alive.reduce((s,a)=>s*a.cd.weight*a.k.weight,0);let r=total*0.62,pick=alive[0];
  for(const a of alive){r-=a.cd.weight*a.k.weight;if(r<=0){pick=a;break}}
  state.simResult={lines,
    pick:`本轮选中（SWRR 指针）：${pick.c.name} · <b class="mono">${pick.k.name}</b> → ${pick.cd.up}<br>失败时 attempt++ 排除该 connection 重选，上限 ${g.config.max_attempts} 次`,
    sticky:`会话指纹 sess-3f2a：sticky-N=${g.config.sticky_n}，前 3 轮粘住该连接以命中上游 prompt cache`};
  renderGroups();
}

function pipelineEditor(g){
  const fan=g.candidates.filter(c=>c.role==='fanout'),judge=g.candidates.find(c=>c.role==='judge');
  const W=430;const fy=85,jy=190,oy=270;
  const fx=i=>W/2+(i-(fan.length-1)/2)*115;
  let dag=`<svg class="dag-svg" viewBox="0 0 ${W} 300" width="100%">
    <defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round"/></marker></defs>
    <rect x="${W/2-45}" y="20" width="90" height="30" rx="7" fill="#eef2ff" stroke="#4f46e5" stroke-width=".5"/><text x="${W/2}" y="35" text-anchor="middle" dominant-baseline="central" fill="#4338ca">请求进入</text>`;
  fan.forEach((f,i)=>{const c=chById(f.channel);const x=fx(i);
    dag+=`<line x1="${W/2}" y1="50" x2="${x}" y2="${fy-15}" stroke="#94a3b8" stroke-width="1" marker-end="url(#ar)"/>
    <rect x="${x-42}" y="${fy-15}" width="84" height="34" rx="7" fill="#fff" stroke="${chColor(c)}" stroke-width="1"/>
    <text x="${x}" y="${fy-4}" text-anchor="middle" dominant-baseline="central" fill="#0f172a" style="font-size:9px">${f.up.length>14?f.up.slice(0,13)+'…':f.up}</text>
    <text x="${x}" y="${fy+7}" text-anchor="middle" dominant-baseline="central" fill="#64748b" style="font-size:8px">${c.name.slice(0,10)}</text>
    <line x1="${x}" y1="${fy+19}" x2="${W/2}" y2="${jy-15}" stroke="#94a3b8" stroke-width="1" marker-end="url(#ar)"/>`});
  const jc=chById(judge.channel);
  dag+=`<rect x="${W/2-55}" y="${jy-15}" width="110" height="34" rx="7" fill="#faf5ff" stroke="#7e22ce" stroke-width="1"/>
    <text x="${W/2}" y="${jy-4}" text-anchor="middle" dominant-baseline="central" fill="#7e22ce" style="font-size:9px">judge · ${judge.up}</text>
    <text x="${W/2}" y="${jy+8}" text-anchor="middle" dominant-baseline="central" fill="#64748b" style="font-size:8px">${jc.name.slice(0,12)}</text>
    <line x1="${W/2}" y1="${jy+19}" x2="${W/2}" y2="${oy-15}" stroke="#94a3b8" stroke-width="1" marker-end="url(#ar)"/>
    <rect x="${W/2-45}" y="${oy-15}" width="90" height="30" rx="7" fill="#f0fdf4" stroke="#15803d" stroke-width=".5"/><text x="${W/2}" y="${oy}" text-anchor="middle" dominant-baseline="central" fill="#15803d">流式返回</text></svg>`;
  const est=fan.reduce((s,f)=>s+({gpt4o:0.011,'claude-sonnet-4':0.016,'deepseek-chat':0.002}[f.up]??0.005),0)+0.014;
  return `<div class="split"><div style="flex:1.2">
  <div class="card"><b style="font-size:13px">编排（1 → N → 1，固定一层 DAG）</b><div style="margin-top:8px">${dag}</div></div>
  <div class="card" style="margin-top:14px"><b style="font-size:13px">扇出候选（role=fanout，N ≤ 4）</b>
    <div style="margin-top:10px">${fan.map(f=>{const c=chById(f.channel);return `<div class="cand-row" style="padding:7px 12px">
      <b style="color:${chColor(c)}">${chTag(c)}</b><div style="flex:1"><span class="mono">${f.up}</span><span class="mini"> · ${c.name}</span></div>
      <label class="mini"><input type="checkbox" checked onchange="this.closest('.cand-row').style.opacity=this.checked?1:.4"> 启用</label></div>`}).join('')}
      <div class="mini">候选选择器中 pipeline 型分组置灰——<b>禁嵌套</b>。</div></div></div></div>
  <div style="flex:1"><div class="card"><b style="font-size:13px">参数与成本</b>
    <div class="kv" style="margin-top:10px">
      <span class="k">fanout_timeout</span><td class="mono">${g.config.fanout_timeout_ms/1000}s（超时截断该路）</td>
      <span class="k">heartbeat</span><td class="mono">${g.config.heartbeat_ms/1000}s（SSE 注释帧 <span class="mono">: ping</span> 保活）</td>
      <span class="k">judge</span><td class="mono">${judge.up} · ${chName(judge.channel)}</td>
    </div>
    <div class="fld" style="margin-top:10px"><label>judge_prompt</label><textarea>${g.config.judge_prompt}</textarea></div>
    <div class="result-box">预估单次成本 ≈ <b>$${est.toFixed(3)}</b>（按各候选 in/out 均价 × 采样 1.2k tok 估算）</div>
    <div class="note" style="margin-top:10px">心跳帧兼容性为开放问题 #3：需实测 openai-python / anthropic-sdk / gemini-sdk 对 SSE 注释行的解析。</div>
  </div></div></div>`;
}

function renderKeys(){
  document.getElementById('page-keys').innerHTML=`
  <div class="ph"><h1>令牌</h1><span class="desc">代理自身 API Key · 授权分组（Q3 隔离主机制）</span></div>
  <div class="card"><table><thead><tr><th>名称</th><th>令牌</th><th>授权分组（glob）</th><th>请求数</th><th>近 7 日成本</th><th></th></tr></thead><tbody>
  ${keys.map(k=>`<tr>
    <td><b>${k.name}</b></td>
    <td class="mono">sk-ag-••••${String(k.id*731%9000+1000)}</td>
    <td>${k.allowed?`<span class="badge b-pri mono">${k.allowed}</span>`:'<span class="badge b-green">全部分组</span>'}</td>
    <td class="mono">${k.reqs.toLocaleString()}</td><td class="mono">$${k.cost.toFixed(2)}</td>
    <td><button onclick="openKeyEditor(${k.id})">编辑授权</button></td></tr>`).join('')}
  </tbody></table>
  <div class="hr"></div><div class="mini">请求未授权的分组名 → 403；/v1/models 按令牌过滤返回。路径前缀（/openai/v1/...）仅作辅助别名，不作为主机制。</div></div>`;
}
let kvState=null;
function openKeyEditor(id){
  const k=keys.find(x=>x.id===id);
  kvState={set:new Set(k.allowed?k.allowed.split('|').filter(x=>!x.includes('*')):[]),glob:k.allowed?k.allowed.split('|').filter(x=>x.includes('*')).join('|'):''};
  drawKeyEditor();
}
function toggleKG(name){kvState.set.has(name)?kvState.set.delete(name):kvState.set.add(name);drawKeyEditor()}
function drawKeyEditor(){
  document.getElementById('drawer-body').innerHTML=`
    <div class="fld"><label>授权分组（勾选或 glob 混合）</label>
    ${groups.map(g=>`<label style="display:flex;gap:8px;align-items:center;padding:5px 0">
      <input type="checkbox" ${kvState.set.has(g.name)?'checked':''} onchange="toggleKG('${g.name}')">
      <span class="mono">${g.name}</span> ${typeBadge(g.type)}</label>`).join('')}
    </div>
    <div class="fld"><label>glob（与勾选合并）</label><input class="mono" value="${kvState.glob}" oninput="kvState.glob=this.value;drawKeyEditor()"></div>
    <div class="result-box"><b style="font-size:12px">模拟 /v1/models 返回</b>
      <div class="mono" style="margin-top:6px;color:var(--pri)">${[...kvState.set,...(kvState.glob?kvState.glob.split('|'):'')].filter(Boolean).join(' · ')||'（无授权 → 所有请求 403）'}</div></div>
    <div class="mini" style="margin-top:10px">allowed_models 存储为合并后的 glob 串（如 team-*|gpt-4o），NULL = 全部。</div>`;
}

function statusBadge(s){return badge(s==='ok'?'✓ 成功':s==='timeout'?'超时':s==='l1_tripped'?'L1 熔断':s,s==='ok'?'b-green':s==='timeout'?'b-amber':'b-red')}
function renderLogs(){
  document.getElementById('page-logs').innerHTML=`
  <div class="ph"><h1>日志</h1><span class="desc">trace 树 · attempt 链 · pipeline 子请求（role 着色）</span></div>
  <div class="card"><table><thead><tr><th style="width:14px"></th><th>时间</th><th>令牌</th><th>model_in → model_out</th><th>状态</th><th>延迟</th><th>tokens</th><th>成本</th></tr></thead><tbody>
  ${traces.map(t=>`<tr>
    <td><span class="expand" onclick="togLog('${t.id}')">${state.openLogs.has(t.id)?'▾':'▸'}</span></td>
    <td class="mono">${t.time}</td><td>${badge(t.key,'b-gray')}</td>
    <td class="mono">${t.min} <span style="color:var(--t3)">→</span> ${t.mout}</td>
    <td>${statusBadge(t.status)}</td><td class="mono">${(t.lat/1000).toFixed(1)}s</td><td class="mono">${t.tok.toLocaleString()}</td><td class="mono">$${t.cost.toFixed(4)}</td></tr>
    ${state.openLogs.has(t.id)?`<tr><td colspan="8" style="padding:0 8px 10px">
      <div class="tree">
        <div class="mini" style="margin-bottom:4px">trace <span class="mono">${t.id}</span> · 分组 <span class="mono">${t.group}</span> · ${t.children.length} 条子记录</div>
        ${t.children.map(ch=>`<div class="trow">
          <span class="rl">${ch.role==='attempt'?badge('attempt','b-blue'):ch.role==='fanout'?badge('fanout','b-blue'):badge('judge','b-purple')}</span>
          <span class="mono" style="flex:1">${ch.label}</span>
          ${statusBadge(ch.status)}<span class="mini mono">${(ch.lat/1000).toFixed(1)}s</span>
          ${ch.tok?`<span class="mini mono">${ch.tok.toLocaleString()} tok</span>`:''}
          ${ch.cost!=null?`<span class="mini mono">$${ch.cost.toFixed(4)}</span>`:''}</div>`).join('')}
        ${t.children.some(c=>c.role==='attempt')?`<div class="attempt-bar">
          ${t.children.map((c,i)=>`<i style="left:${i*33+8}%;background:${c.status==='ok'?'#22c55e':'#ef4444'}" title="${c.label}"></i>`).join('')}
        </div><div class="mini">attempt 链：attempt 1 失败（L1）→ failover → attempt 2 成功；usage_history 按 trace_id + attempt 落库</div>`:''}
      </div></td>`:''}
  </tr>`).join('')}</tbody></table>
  <div class="hr"></div><div class="mini">fanout=蓝 / judge=紫；pipeline 子请求经 parent_id 关联主行，成本聚合到 trace。L1/L2/L3 状态与失败原因逐 attempt 记录，可诊断「为什么走了中转」。</div></div>`;
}
function togLog(id){state.openLogs.has(id)?state.openLogs.delete(id):state.openLogs.add(id);renderLogs()}

function openDrawer(title,html){document.getElementById('drawer-title').textContent=title;document.getElementById('drawer-body').innerHTML=html;
  document.getElementById('drawer').classList.add('on');document.getElementById('mask').classList.add('on')}
function closeDrawer(){document.getElementById('drawer').classList.remove('on');document.getElementById('mask').classList.remove('on')}

go('dashboard');
</script>
</body>
</html>
