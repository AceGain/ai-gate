packages:
  - apps/*
  - packages/*

# 跨包共享依赖的统一版本声明；各 package.json 用 "catalog:" 引用
catalog:
  '@hono/node-server': ^2.1.5
  '@hono/valibot-validator': ^0.6.1
  '@types/better-sqlite3': ^9.6.0
  '@types/node': ^26.6.5
  better-sqlite3: ^13.0.3
  drizzle-orm: ^0.45.4
  hono: ^4.13.13
  tsx: ^4.23.15
  typescript: ~6.0.3
  valibot: ^1.5.0

dangerouslyAllowAllBuilds: false
allowBuilds:
  better-sqlite3: false
  esbuild: true
